name: Publicar extensiones

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Construir Iniciativa
        working-directory: iniciativa
        run: yarn install --frozen-lockfile && yarn build
      - name: Construir Dados
        working-directory: dados
        run: yarn install && yarn build
      - name: Construir Música
        working-directory: musica
        run: npm install && npm run build
      - name: Construir Fichas
        working-directory: fichas
        run: npm install && npm run build
      - name: Construir Kit de impro
        working-directory: impro
        run: npm install && npm run build
      - name: Armar el sitio
        run: |
          mkdir -p _site
          cp -r pantalla-dm _site/pantalla-dm
          cp -r iniciativa/dist _site/iniciativa
          cp -r dados/dist _site/dados
          cp -r musica/dist _site/musica
          cp -r fichas/dist _site/fichas
          cp -r impro/dist _site/impro
          touch _site/.nojekyll
          cp index.html _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
